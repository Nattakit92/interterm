name: Rust

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
    - uses: actions/checkout@v7
    - name: Add permision
      run: chmod +x test/simple_input.sh
    - name: Test chinese
      run: ./test/simple_input.sh $(cat test/sample-text/chinese.txt)
    - name: Test english
      run: ./test/simple_input.sh $(cat test/sample-text/english.txt)
    - name: Test french
      run: ./test/simple_input.sh $(cat test/sample-text/french.txt)
    - name: Test hindi
      run: ./test/simple_input.sh $(cat test/sample-text/hindi.txt)
    - name: Test japanese
      run: ./test/simple_input.sh $(cat test/sample-text/japanese.txt)
    - name: Test russia
      run: ./test/simple_input.sh $(cat test/sample-text/russia.txt)
    - name: Test thai
      run: ./test/simple_input.sh $(cat test/sample-text/thai.txt)
